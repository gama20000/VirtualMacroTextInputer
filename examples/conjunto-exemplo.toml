# ==========================================================================
#  Virtual Macro Text Inputer — commented example of a macro set
# ==========================================================================
#
# Where it lives: %APPDATA%\VirtualMacroTextInputer\conjuntos\<name>.toml
#   (one file per set; the file name identifies the set)
# To use this example: Settings ▸ ⋯ ▸ Import set…,
#   or copy the file into the "conjuntos" folder.
#
# The program reloads the file automatically every time it is saved.
# If it has an error, the last valid version stays active and a message
# shows the file, line and column of the problem.
#
# Field names are in Portuguese (titulo = title, tecla = key, texto = text,
# repeticoes = repetitions, intervalo_ms = interval); see ARCHITECTURE.md.

# Format version. Required; allows future changes.
versao_esquema = 1

# Name shown in the interface and in the menu of the icon next to the clock.
nome = "Example — Coding"

# --------------------------------------------------------------------------
# Scope: where the keys of this set work (applies to the whole set)
# --------------------------------------------------------------------------
[ambito]
# "global"     -> in every application
# "aplicacoes" -> only in the applications listed below; in the others the
#                 keys work normally (and the panel does not send anything).
modo = "global"
# Executable name (case-insensitive). The full path is also accepted, e.g.
# "C:\\Program Files\\App\\app.exe" (with doubled backslashes).
aplicacoes = ["notepad.exe", "WINWORD.EXE"]

# --------------------------------------------------------------------------
# Macros. The order of the [[macros]] sections is the order of the buttons
# in the grid; changing the order does not change each macro's key.
# --------------------------------------------------------------------------

[[macros]]
titulo = "3E03305"          # text shown on the button (max. 40 characters)
tecla = "1"                  # key 1 on the top row (Numpad1 is a different key)
texto = "3E03305"            # what is typed
repeticoes = 1               # how many times to run per key press (1–1000)
intervalo_ms = 0             # pause between repetitions, in milliseconds
# arquivada = true           # (optional) moves the macro to the Archive: no
#                            # key and not on the panel until it is restored

[[macros]]
titulo = "Z51.11 ⏎"
tecla = "2"
# Commands inside the text:
#   {Enter}  presses Enter
#   {Tab}    presses Tab
#   {Delay:500}  waits 500 ms (0 to 600000)
texto = "Z51.11{Enter}"

[[macros]]
titulo = "Form"
tecla = "3"
# Types ABC, Tab, DEF, waits half a second and presses Enter.
texto = "ABC{Tab}DEF{Delay:500}{Enter}"

[[macros]]
titulo = "Accents"
tecla = "4"
texto = "Ação, coração, pão — €"   # Unicode is supported

[[macros]]
titulo = "3× line"
tecla = "Ctrl+F1"            # with modifiers: fires only with exactly Ctrl+F1
texto = "line{Enter}"
repeticoes = 3
intervalo_ms = 250

[[macros]]
titulo = "Panel only"
tecla = ""                   # no key: can only be run from the panel
texto = "aratumuma"

[[macros]]
tipo = "espaco"              # empty cell: keeps a place in the grid

[[macros]]
titulo = "Play/Pause"
tecla = ""
# Media commands: {MediaPlayPause}, {MediaPrev}, {MediaNext}, {MediaStop},
# {VolumeUp}, {VolumeDown}, {VolumeMute}. A button whose text is only a media
# command shows its symbol (here ▶❚❚).
texto = "{MediaPlayPause}"

[[macros]]
tipo = "contador"            # a button that counts; it types nothing
id = "parts"                 # identifies the count in estado.toml
titulo = "Parts"
tecla = "F9"
incremento = 1               # added on each short press
reposicao = 0                # value after a long press
pressao_longa_ms = 800       # how long to hold to reset
som_reposicao = "aviso"      # optional sound on reset: "padrao", "aviso", "erro", "pergunta"

[[macros]]
titulo = "Old version"
tecla = "1"                  # an archived macro can share the key of an active one
texto = "3E0330"
arquivada = true
