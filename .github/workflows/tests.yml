# Corre os testes no Windows em cada pull request (incluindo os do Dependabot)
# e em cada envio para main, com a versão mínima suportada do Python e a atual.
# Também se pode correr à mão: Actions ▸ Tests ▸ Run workflow.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                 # um envio novo cancela a execução anterior do mesmo ramo
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
