[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macropad"
version = "0.5.0"
license = { text = "MIT" }
description = "Macro pad para Windows: teclas do teclado e painel enviam texto"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.gui-scripts]
macropad = "macropad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macropad = ["locales/*.toml", "ui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
