[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "macropad"
version = "0.5.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Macro pad para Windows: teclas do teclado e painel enviam texto"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.12.0"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pyinstaller>=6.22.3"]

[project.gui-scripts]
macropad = "macropad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macropad = ["locales/*.toml", "ui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
